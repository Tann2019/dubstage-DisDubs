# Baut DubStage-Setup-<Version>.exe auf Windows.
#  - bei jedem Push: als Artefakt des Laufs herunterladbar
#  - bei einem Tag v1.2.3: legt das Release an (Titel und Text aus
#    .github/release-notes/v1.2.3.md) und haengt Setup.exe an
#  - bei einem von Hand veroeffentlichten Release: haengt Setup.exe an
# Signiert wird, wenn die Secrets CODESIGN_PFX_BASE64 und CODESIGN_PASSWORD
# gesetzt sind (siehe installer/build.ps1).
name: Windows installer

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  setup-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }

      - name: Build
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        run: ./installer/build.ps1

      - name: Tag matches VERSION
        if: github.ref_type == 'tag' || github.event_name == 'release'
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "release") { "${{ github.event.release.tag_name }}" } else { "${{ github.ref_name }}" }
          $m = Select-String -Path updater.py -Pattern '^VERSION\s*=\s*"([^"]+)"'
          $ver = $m.Matches[0].Groups[1].Value
          if ($tag -ne "v$ver") { throw "Tag $tag passt nicht zu VERSION $ver in updater.py" }

      - name: Tests (with the bundled Python)
        shell: pwsh
        run: |
          build\runtime\python.exe -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Silent install smoke test
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP "dubstage-install"
          Start-Process $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`"", "/LOG=`"$env:RUNNER_TEMP\setup.log`"" -Wait
          Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 40
          foreach ($f in "runtime\pythonw.exe", "tools\ffmpeg.exe", "tools\ffprobe.exe", "DubForge.pyw", "DubStage.pyw", "assets\dubstage.ico") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing after install: $f" }
          }
          & (Join-Path $dir "runtime\python.exe") -c "import sys; sys.path.insert(0, r'$dir'); import dubforge_core as pc; print(pc.ffmpeg()); print(pc.ytdlp())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $shortcut = Join-Path ([Environment]::GetFolderPath("Programs")) "DubStage.lnk"
          if (-not (Test-Path $shortcut)) { throw "start menu shortcut missing" }

      - uses: actions/upload-artifact@v4
        with:
          name: DubStage-Setup
          path: dist/*.exe
          if-no-files-found: error

      - name: Create release
        if: github.ref_type == 'tag' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = (Get-ChildItem dist\*.exe).FullName
          $notes = ".github/release-notes/$tag.md"
          if (-not (Test-Path $notes)) { throw "$notes fehlt" }
          $lines = Get-Content $notes -Encoding utf8
          $title = $lines[0] -replace '^#\s*', ''
          $body = Join-Path $env:RUNNER_TEMP "body.md"
          ($lines | Select-Object -Skip 1) -join "`n" | Set-Content $body -Encoding utf8
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
          } else {
            gh release create $tag $files --title $title --notes-file $body --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Attach to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $files = (Get-ChildItem dist\*.exe).FullName
          gh release upload $tag $files --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Von Hand ohne Text veroeffentlicht? Titel und Text aus den
          # vorbereiteten Release-Notes uebernehmen.
          $notes = ".github/release-notes/$tag.md"
          $body = gh release view $tag --json body --jq .body
          if ((Test-Path $notes) -and -not "$body".Trim()) {
            $lines = Get-Content $notes -Encoding utf8
            $title = $lines[0] -replace '^#\s*', ''
            $file = Join-Path $env:RUNNER_TEMP "body.md"
            ($lines | Select-Object -Skip 1) -join "`n" | Set-Content $file -Encoding utf8
            gh release edit $tag --title $title --notes-file $file
          }
